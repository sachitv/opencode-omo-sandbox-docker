services:
  workspace:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    command: sleep infinity
    init: true
    depends_on:
      mitmproxy:
        condition: service_started
      coredns:
        condition: service_started
      openrouter-proxy:
        condition: service_started
      perplexity-mcp:
        condition: service_started
      git-broker:
        condition: service_started
      brave-search-mcp:
        condition: service_started
    environment:
      OPENAI_BASE_URL: http://127.0.0.1:4000/v1
      PERPLEXITY_MCP_URL: http://127.0.0.1:8081/mcp
      GIT_BROKER_MCP_URL: http://127.0.0.1:8082/mcp
      BRAVE_SEARCH_MCP_URL: http://127.0.0.1:8083/mcp
      MITMPROXY_CA_CERT_PATH: /mitmproxy-certs/mitmproxy-ca-cert.pem
      SSH_AUTH_SOCK: ""
    cap_drop:
      - NET_RAW
    network_mode: "service:mitmproxy"
    volumes:
      # The workspace mount is the agent's working tree inside the devcontainer.
      - .:/workspaces/opencode-omo-sandbox-docker:cached
      # Keep service implementations visible to the agent without allowing edits
      # from inside the workspace container.
      - ./services:/workspaces/opencode-omo-sandbox-docker/services:ro
      # If the host checkout contains a repo-root .env file, mask it inside the
      # workspace with the tracked .env.example so the agent never sees real
      # repo-local secrets through the main repo bind mount.
      - ./.env.example:/workspaces/opencode-omo-sandbox-docker/.env:ro
      # Share the mitmproxy CA so TLS clients in the workspace trust the local MITM.
      - mitmproxy_certs:/mitmproxy-certs:ro

  openrouter-proxy:
    build:
      context: ./services/openrouter-proxy
    depends_on:
      mitmproxy:
        condition: service_started
      coredns:
        condition: service_started
    environment:
      PORT: 4000
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_HTTP_REFERER: ${OPENROUTER_HTTP_REFERER:-https://example.com}
      OPENROUTER_X_TITLE: ${OPENROUTER_X_TITLE:-opencode-devcontainer}
      MITMPROXY_CA_CERT_PATH: /mitmproxy-certs/mitmproxy-ca-cert.pem
    network_mode: "service:mitmproxy"
    volumes:
      # Share the same mitmproxy CA so the entrypoint can install it into the system trust store.
      - mitmproxy_certs:/mitmproxy-certs:ro

  perplexity-mcp:
    build:
      context: ./services/perplexity-mcp
    depends_on:
      mitmproxy:
        condition: service_started
      coredns:
        condition: service_started
    environment:
      HOST: 0.0.0.0
      PORT: 8081
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY}
      MITMPROXY_CA_CERT_PATH: /mitmproxy-certs/mitmproxy-ca-cert.pem
    network_mode: "service:mitmproxy"
    volumes:
      # Share the mitmproxy CA so the entrypoint can install it into the system trust store.
      - mitmproxy_certs:/mitmproxy-certs:ro

  # Narrow Git access broker. This is the only service that gets the dedicated
  # host-side deploy-key agent state, and it exposes only MCP tools for fetch
  # and push rather than raw credentials in the workspace.
  git-broker:
    build:
      context: ./services/git-broker
    depends_on:
      mitmproxy:
        condition: service_started
      coredns:
        condition: service_started
    environment:
      HOST: 0.0.0.0
      PORT: 8082
      REPO_PATH: /repo
      AGENT_STATE_DIR: /host-agent-state
      AGENT_KEY_DIR: /host-agent-keys
    network_mode: "service:mitmproxy"
    volumes:
      # Mount the repo so the broker can inspect origin, branch, and HEAD before
      # allowing fetch/push operations on behalf of the agent.
      - .:/repo:cached
      # Mount only the recorded deploy-key policy state from the host.
      - ${HOME}/.local/state/opencode-sandbox:/host-agent-state
      # Mount the dedicated deploy private key read-only only into the broker.
      - ${HOME}/.local/share/opencode-sandbox/keys:/host-agent-keys:ro

  brave-search-mcp:
    build:
      context: ./services/brave-search-mcp
    depends_on:
      mitmproxy:
        condition: service_started
      coredns:
        condition: service_started
    environment:
      BRAVE_API_KEY: ${BRAVE_API_KEY}
      BRAVE_MCP_TRANSPORT: http
      BRAVE_MCP_PORT: 8083
      BRAVE_MCP_HOST: 0.0.0.0
      MITMPROXY_CA_CERT_PATH: /mitmproxy-certs/mitmproxy-ca-cert.pem
    network_mode: "service:mitmproxy"
    volumes:
      # Share the mitmproxy CA so the entrypoint can install it into the system trust store.
      - mitmproxy_certs:/mitmproxy-certs:ro

  coredns:
    build:
      context: .
      dockerfile: infra/coredns/Dockerfile
    depends_on:
      mitmproxy:
        condition: service_started
    network_mode: "service:mitmproxy"
    user: "${COREDNS_UID:-10002}"
    read_only: true

  mitmproxy:
    build:
      context: ./infra/mitmproxy
    environment:
      MITMPROXY_LISTEN_PORT: 8080
      COREDNS_UID: ${COREDNS_UID:-10002}
    ports:
      # Publish on loopback only. Host ports default to 0 so Docker allocates a
      # free ephemeral port, which allows multiple stacks to run concurrently.
      # Set any of these env vars explicitly if you need a stable host port.
      - target: 4096
        published: "${HOST_OPENCODE_PORT:-0}"
        host_ip: 127.0.0.1
      - target: 4000
        published: "${HOST_OPENROUTER_PORT:-0}"
        host_ip: 127.0.0.1
      - target: 8081
        published: "${HOST_PERPLEXITY_MCP_PORT:-0}"
        host_ip: 127.0.0.1
      - target: 8082
        published: "${HOST_GIT_BROKER_MCP_PORT:-0}"
        host_ip: 127.0.0.1
      - target: 8083
        published: "${HOST_BRAVE_SEARCH_MCP_PORT:-0}"
        host_ip: 127.0.0.1
      - target: 8080
        published: "${HOST_MITMPROXY_PORT:-0}"
        host_ip: 127.0.0.1
    volumes:
      # Persist the generated mitmproxy CA so the other services can trust it
      # across container restarts.
      - mitmproxy_certs:/home/mitmproxy/.mitmproxy
    cap_add:
      - NET_ADMIN
    networks:
      - ai_boundary
      - ai_egress

networks:
  ai_boundary:
    internal: true
  ai_egress: {}

volumes:
  mitmproxy_certs: {}
