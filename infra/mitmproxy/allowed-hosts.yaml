# Exact host matches.
# Use this for stable API hosts and registries.
exact:
  - openrouter.ai
  - opencode.ai

  # For MCP Servers
  - mcp.exa.ai
  - search.brave.com
  - mcp.grep.app
  - mcp.context7.com
  - api.perplexity.ai

  # GitHub and release assets
  - github.com
  - api.github.com
  - raw.githubusercontent.com
  - codeload.github.com
  - objects.githubusercontent.com
  - release-assets.githubusercontent.com

  # JS package managers
  - registry.npmjs.org
  - jsr.io
  - esm.sh
  - cdn.jsdelivr.net

  # deno
  - deno.land
  - dl.deno.land

  # Python
  - pypi.org
  - files.pythonhosted.org

  # Rust / Cargo
  - crates.io
  - index.crates.io
  - static.crates.io

  # Go
  - proxy.golang.org
  - sum.golang.org

  # Ruby
  - rubygems.org

  # Debian / Ubuntu package repositories
  - archive.ubuntu.com
  - security.ubuntu.com
  - deb.debian.org

# Wildcard suffixes.
# "*.example.com" matches "foo.example.com" but not bare "example.com".
wildcards:
  # These are currently not used for security purposes, but you may want to add some in the future.
  # - "*.opencode.ai"
  # - "*.search.brave.com"
